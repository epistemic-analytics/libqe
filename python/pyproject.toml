[build-system]
requires = ["scikit-build-core>=0.4", "nanobind>=1.9"]
build-backend = "scikit_build_core.build"

[project]
name = "qe-lib"
version = "0.1.9"
description = "Python bindings for libqe — low-level QE math including ENA, accumulation, door, and trajectory kernels"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "numpy"]

[project.urls]
Homepage = "https://github.com/epistemic-analytics/libqe"
Documentation = "https://qe-libs.org/py/"
Repository = "https://github.com/epistemic-analytics/libqe"
"Bug Tracker" = "https://github.com/epistemic-analytics/libqe/issues"

[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = ["qe"]
# A fixed build dir instead of a temp one: on Windows, deleting the temp build
# dir races with handles still held open (WinError 32) and fails the build.
build-dir = "build/{wheel_tag}"
# include/ is git-ignored (copied by scripts/sync-headers.sh) but must ship in
# the sdist; build/ must not.
sdist.include = ["include/"]
sdist.exclude = ["build/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
