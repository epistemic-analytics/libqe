[build-system]
requires = ["scikit-build-core>=0.4", "nanobind>=1.9"]
build-backend = "scikit_build_core.build"

[project]
name = "pylibqe"
version = "0.1.5"
description = "Python bindings for libqe — low-level QE math including ENA, accumulation, door, and trajectory kernels"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "numpy"]

[project.urls]
Homepage = "https://github.com/epistemic-analytics/libqe"
Documentation = "https://qe-libs.org/py/"
Repository = "https://github.com/epistemic-analytics/libqe"
"Bug Tracker" = "https://github.com/epistemic-analytics/libqe/issues"

[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = ["pylibqe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
