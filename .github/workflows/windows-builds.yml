name: Windows builds

# Builds the Windows binaries that the GitLab SaaS runners can't produce
# (R binary .zip + compiled Python wheels). GitHub's windows-latest ships Rtools
# via r-lib/actions and a preinstalled vcpkg with a native Actions binary cache,
# so the Rtools-install hang and the slow-cold-vcpkg problems don't apply here.
#
# For now this builds from the repo and uploads artifacts. Wiring cranqe to
# trigger this and pull the artifacts back into the qe-libs registries is a
# follow-up (workflow_dispatch inputs below are the hook for that).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref/tag to build (default: the branch this runs on)"
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: windows-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # R Windows binary (.zip) per R version.
  # r-lib/actions/setup-r installs R + the matching Rtools automatically.
  # ---------------------------------------------------------------------------
  r-windows:
    name: R ${{ matrix.r }} Windows binary
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        r: ["4.5", "4.6"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          # Rtools is selected automatically for the R version.
          update-rtools: true

      - name: Sync headers into R/inst/include
        shell: bash
        run: sh scripts/sync-headers.sh

      - name: Install R deps + generate Rcpp exports
        shell: Rscript {0}
        run: |
          install.packages(
            c("Rcpp", "RcppArmadillo", "testthat"),
            repos = "https://packagemanager.posit.co/cran/latest"
          )
          # RcppExports.cpp/.R are gitignored (generated) — regenerate before build.
          Rcpp::compileAttributes("R/")

      - name: Build Windows binary
        shell: bash
        run: |
          set -e
          R CMD INSTALL --build R/
          mkdir -p out
          mv *.zip out/
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: libqe-R${{ matrix.r }}-windows
          path: out/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Python Windows wheel per Python version.
  # Armadillo (+ OpenBLAS/LAPACK) via the preinstalled vcpkg, with vcpkg's
  # GitHub Actions binary cache (x-gha): the cold build happens once, then
  # every later run restores the compiled ports from the Actions cache.
  # ---------------------------------------------------------------------------
  python-windows:
    name: Python ${{ matrix.py }} Windows wheel
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        py: ["3.11", "3.12", "3.13"]
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      # vcpkg's x-gha binary cache needs these two runtime values exported.
      - name: Enable vcpkg GitHub Actions cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Armadillo via vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install armadillo --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      - name: Build wheel
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts\buildsystems\vcpkg.cmake"
          $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows"
          $env:CMAKE_ARGS = "-DCMAKE_TOOLCHAIN_FILE=$toolchain -DVCPKG_TARGET_TRIPLET=x64-windows -DBLA_VENDOR=OpenBLAS"
          $env:PATH = "$installed\bin;$env:PATH"   # openblas/lapack DLLs for import at build time
          python -m pip install --upgrade pip build
          Set-Location python
          python -m build --wheel --outdir ..\wheelhouse
          if ($LASTEXITCODE -ne 0) { throw "wheel build failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: libqe-py${{ matrix.py }}-windows
          path: wheelhouse/*.whl
          if-no-files-found: error
