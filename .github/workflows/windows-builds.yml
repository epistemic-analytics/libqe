name: Windows builds

# Builds the Windows binaries that the GitLab SaaS runners can't produce
# (R binary .zip + compiled Python wheels). GitHub's windows-latest ships Rtools
# via r-lib/actions and a preinstalled vcpkg with a native Actions binary cache,
# so the Rtools-install hang and the slow-cold-vcpkg problems don't apply here.
#
# For now this builds from the repo and uploads artifacts. Wiring cranqe to
# trigger this and pull the artifacts back into the qe-libs registries is a
# follow-up (workflow_dispatch inputs below are the hook for that).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref/tag to build (default: the branch this runs on)"
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: windows-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # R Windows binary (.zip) per R version.
  # r-lib/actions/setup-r installs R + the matching Rtools automatically.
  # ---------------------------------------------------------------------------
  r-windows:
    name: R ${{ matrix.r }} Windows binary
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        r: ["4.5", "4.6"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          # Rtools is selected automatically for the R version.
          update-rtools: true

      - name: Sync headers into R/inst/include
        shell: bash
        run: sh scripts/sync-headers.sh

      - name: Install R deps + generate Rcpp exports
        shell: Rscript {0}
        run: |
          install.packages(
            c("Rcpp", "RcppArmadillo", "testthat"),
            repos = "https://packagemanager.posit.co/cran/latest"
          )
          # RcppExports.cpp/.R are gitignored (generated) — regenerate before build.
          Rcpp::compileAttributes("R/")

      - name: Build Windows binary
        shell: bash
        run: |
          set -e
          R CMD INSTALL --build R/
          mkdir -p out
          mv *.zip out/
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: libqe-R${{ matrix.r }}-windows
          path: out/*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Python Windows wheels (3.11-3.13) via cibuildwheel.
  #  - Armadillo (+ BLAS/LAPACK) from the preinstalled vcpkg, cached via x-gha
  #    (cold build once; installed once for all versions in CIBW_BEFORE_ALL).
  #  - delvewheel repair bundles the vcpkg DLLs into each wheel so it imports
  #    without vcpkg present (the Windows equivalent of auditwheel).
  #  - cibuildwheel also handles the per-version matrix and the Windows
  #    temp-cleanup quirk that made a raw `python -m build` flaky.
  # ---------------------------------------------------------------------------
  python-windows:
    name: Python wheels (Windows)
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # vcpkg's x-gha binary cache needs these two runtime values exported.
      - name: Enable vcpkg GitHub Actions cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Build + repair wheels
        shell: pwsh
        env:
          CIBW_BUILD: "cp311-win_amd64 cp312-win_amd64 cp313-win_amd64"
          # Install native deps once before building (shared across versions).
          CIBW_BEFORE_ALL_WINDOWS: 'C:\vcpkg\vcpkg.exe install armadillo --triplet x64-windows'
          # Forward-slash toolchain path — backslashes get stripped in -D values.
          CIBW_ENVIRONMENT_WINDOWS: 'CMAKE_ARGS="-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows"'
          # Bundle armadillo/openblas/lapack/gfortran DLLs into each wheel.
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: 'delvewheel repair --add-path C:/vcpkg/installed/x64-windows/bin -w {dest_dir} {wheel}'
        run: |
          python -m pip install --upgrade pip cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse python
          if ($LASTEXITCODE -ne 0) { throw "cibuildwheel failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: libqe-python-windows
          path: wheelhouse/*.whl
          if-no-files-found: error
