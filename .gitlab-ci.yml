stages:
  - build
  - test
  - publish

# ── shared cache keys ─────────────────────────────────────────────────────────
.pip-cache: &pip-cache
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.pip-cache]
    policy: pull-push

.conan-cache: &conan-cache
  cache:
    key: conan2-$CI_COMMIT_REF_SLUG
    paths: [.conan2]
    policy: pull-push

.wasm-conan-cache: &wasm-conan-cache
  cache:
    key: conan2-wasm-$CI_COMMIT_REF_SLUG
    paths: [wasm/.conan2]
    policy: pull-push

variables:
  # Conan 2 stores its home in $CONAN_HOME; pin it inside the project dir
  # so GitLab's cache mechanism can pick it up.
  CONAN_HOME: "$CI_PROJECT_DIR/.conan2"

# ── Build WASM module ─────────────────────────────────────────────────────────
# Runs in the build stage so test:wasm can consume the dist/ artifact.
# R, Python, and Conan test jobs use needs:[] to bypass the build stage
# and run immediately in parallel.
build:wasm:
  stage: build
  image: emscripten/emsdk:latest
  variables:
    CONAN_HOME: "$CI_PROJECT_DIR/wasm/.conan2"
  <<: *wasm-conan-cache
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends ninja-build
    - pip install conan --quiet --break-system-packages
    - conan profile detect --force
  script:
    - sh wasm/scripts/build.sh
  artifacts:
    paths: [wasm/dist/]
    expire_in: 1 day

# ── R tests ───────────────────────────────────────────────────────────────────
test:r:
  stage: test
  needs: []   # don't wait for build:wasm
  image: rocker/r-ver:4.5.0
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends libarmadillo-dev
    - Rscript -e "install.packages(
        c('Rcpp', 'RcppArmadillo', 'testthat'),
        repos = 'https://packagemanager.posit.co/cran/__linux__/noble/latest',
        quiet = TRUE)"
    # Ensure inst/include/ is populated before R CMD INSTALL runs configure.
    # (configure handles this automatically when ../include/ exists, but the
    # explicit sync makes the step visible in CI logs.)
    - sh scripts/sync-headers.sh
    # RcppExports.cpp/.R are gitignored (generated artefacts); regenerate them
    # here so R CMD INSTALL has the full registration table.
    - Rscript -e "Rcpp::compileAttributes('R/')"
  script:
    - bash scripts/check-headers-in-sync.sh
    - R CMD INSTALL R/
    - Rscript -e "testthat::test_local('R', reporter = 'progress')"

# ── Python tests ──────────────────────────────────────────────────────────────
test:python:
  stage: test
  needs: []   # don't wait for build:wasm
  image: python:3.12-slim
  <<: *pip-cache
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
        cmake libarmadillo-dev build-essential
    - pip install --cache-dir .pip-cache nanobind scikit-build-core
  script:
    - cd python
    - pip install --cache-dir ../.pip-cache -e ".[dev]"
    - pytest tests/ -v

# ── Conan package verification (every push) ───────────────────────────────────
# Runs `conan create` locally (without uploading) to verify the recipe and
# test package build cleanly on every branch push.
test:conan:
  stage: test
  needs: []   # don't wait for build:wasm
  image: ubuntu:24.04
  <<: *conan-cache
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends build-essential cmake ninja-build python3-pip
    - pip3 install conan --break-system-packages
    - conan profile detect --force
  script:
    - conan create . --test-folder=conan-test --build=missing

# ── WASM JS tests ─────────────────────────────────────────────────────────────
test:wasm:
  stage: test
  needs: [build:wasm]
  image: node:20-slim
  script:
    - cd wasm
    - npm ci
    - npm test

# ── Publish to GitLab Package Registry (version tags only) ───────────────────
#
# Trigger: push a tag matching vMAJOR.MINOR.PATCH, e.g. v0.2.0
#
# The tag drives the package version via set_version() in conanfile.py.
# Authentication uses the built-in CI_JOB_TOKEN — no personal access token
# or deploy key needed.
#
# Consumers add the Conan registry with:
#   conan remote add gitlab \
#     "https://gitlab.com/api/v4/packages/conan"
#
# Consumers add the npm registry with (one-time, then npm install works):
#   echo "@qe-libs:registry=https://gitlab.com/api/v4/projects/epistemic-analytics%2Fqe-packages%2Flibqe/packages/npm/" >> ~/.npmrc
publish:conan:
  stage: publish
  needs: []
  image: ubuntu:24.04
  <<: *conan-cache
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends build-essential cmake ninja-build python3-pip
    - pip3 install conan --break-system-packages
    - conan profile detect --force
    - conan remote add gitlab
        "${CI_API_V4_URL}/packages/conan" --force
    - conan remote login gitlab ci-job-token
        --password "${CI_JOB_TOKEN}"
  script:
    # CI_COMMIT_TAG is e.g. "v0.2.0"; strip the leading 'v' for the version.
    - export PKG_VERSION="${CI_COMMIT_TAG#v}"
    - export PKG_USER="${CI_PROJECT_NAMESPACE}"
    - conan create . --test-folder=conan-test --build=missing
    - conan upload "libqe/${PKG_VERSION}@${PKG_USER}/stable"
        --remote=gitlab --confirm

publish:wasm:
  stage: publish
  needs: [build:wasm, test:wasm]
  image: node:20-slim
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  before_script:
    - echo "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> ~/.npmrc
  script:
    - cd wasm
    - npm version "${CI_COMMIT_TAG#v}" --no-git-tag-version
    - npm publish --registry "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"

include:
  - project: 'epistemic-analytics/qe-packages/cranqe'
    ref: main
    file: '/ci-templates/trigger-cranqe.yml'