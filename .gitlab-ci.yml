stages:
  - build
  - test
  - publish

# ── shared cache keys ─────────────────────────────────────────────────────────
.pip-cache: &pip-cache
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.pip-cache]
    policy: pull-push

.conan-cache: &conan-cache
  cache:
    key: conan2-$CI_COMMIT_REF_SLUG
    paths: [.conan2]
    policy: pull-push

.wasm-conan-cache: &wasm-conan-cache
  cache:
    key: conan2-wasm-$CI_COMMIT_REF_SLUG
    paths: [wasm/.conan2]
    policy: pull-push

variables:
  # Conan 2 stores its home in $CONAN_HOME; pin it inside the project dir
  # so GitLab's cache mechanism can pick it up.
  CONAN_HOME: "$CI_PROJECT_DIR/.conan2"

# ── Build WASM module ─────────────────────────────────────────────────────────
# Runs in the build stage so test:wasm can consume the dist/ artifact.
# R, Python, and Conan test jobs use needs:[] to bypass the build stage
# and run immediately in parallel.
build:wasm:
  stage: build
  image: emscripten/emsdk:latest
  variables:
    CONAN_HOME: "$CI_PROJECT_DIR/wasm/.conan2"
  <<: *wasm-conan-cache
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends ninja-build
    - pip install conan --quiet --break-system-packages
    - conan profile detect --force
  script:
    - sh wasm/scripts/build.sh
  artifacts:
    paths: [wasm/dist/]
    expire_in: 1 day

# ── R tests ───────────────────────────────────────────────────────────────────
test:r:
  stage: test
  needs: []   # don't wait for build:wasm
  image: rocker/r-ver:4.5.0
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends libarmadillo-dev
    - Rscript -e "install.packages(
        c('Rcpp', 'RcppArmadillo', 'testthat'),
        repos = 'https://packagemanager.posit.co/cran/__linux__/noble/latest',
        quiet = TRUE)"
    # RcppExports.cpp/.R are committed; regenerate them so the registration
    # table always matches src/libqe_rcpp.cpp.
    - Rscript -e "Rcpp::compileAttributes('R/')"
  script:
    # R/inst/include/libqe/ is a committed copy of include/libqe/; fail if a
    # header was edited without running scripts/sync-headers.sh.
    - bash scripts/check-headers-in-sync.sh
    - R CMD INSTALL R/
    - Rscript -e "testthat::test_local('R', reporter = 'progress')"

# ── Python tests ──────────────────────────────────────────────────────────────
test:python:
  stage: test
  needs: []   # don't wait for build:wasm
  image: python:3.12-slim
  <<: *pip-cache
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
        cmake libarmadillo-dev build-essential
    - pip install --cache-dir .pip-cache nanobind scikit-build-core
  script:
    - cd python
    - pip install --cache-dir ../.pip-cache -e ".[dev]"
    - pytest tests/ -v

# ── Conan package verification (every push) ───────────────────────────────────
# Runs `conan create` locally (without uploading) to verify the recipe and
# test package build cleanly on every branch push.
test:conan:
  stage: test
  needs: []   # don't wait for build:wasm
  image: ubuntu:24.04
  <<: *conan-cache
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends build-essential cmake ninja-build python3-pip
    - pip3 install conan --break-system-packages
    - conan profile detect --force
  script:
    - conan create . --test-folder=conan-test --build=missing

# ── WASM JS tests ─────────────────────────────────────────────────────────────
# Override needs: so the test consumes the compiled dist/ artifact from build:wasm.
# The rest of the job (image, registry setup, script) comes from the template.
test:wasm:
  needs: [build:wasm]

# ── Note: Conan publishing is handled by cranqe ───────────────────────────────
# publish:conan was removed. cranqe builds and uploads to the shared Conan
# registry (project 22522458) on version tags, the same as npm/wasm.
# See cranqe packages.yml (libqe language: conan) and scripts/conan/publish.py.

include:
  - project: 'epistemic-analytics/qe-packages/cranqe'
    ref: main
    file: '/ci-templates/trigger-cranqe.yml'
  - project: 'epistemic-analytics/qe-packages/cranqe'
    ref: main
    file: '/ci-templates/npm-registry.yml'